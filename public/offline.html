<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | EuroDeal</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f7f7f5; color: #14201f; padding: 24px;
      }
      .card {
        max-width: 26rem; text-align: center; background: #fff; border-radius: 24px;
        padding: 32px; box-shadow: 0 24px 60px -24px rgba(15, 61, 62, 0.35);
      }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: #5c6b69; font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
      a {
        display: inline-block; background: #0f3d3e; color: #fff; text-decoration: none;
        padding: 12px 20px; border-radius: 999px; font-weight: 600;
      }
      img { width: 72px; height: 72px; border-radius: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="EuroDeal" width="72" height="72" />
      <h1>Du bist offline</h1>
      <p>
        Diese Seite ist offline nicht verfügbar. Deine gespeicherten Anzeigen kannst du
        weiterhin öffnen – inklusive Bilder.
      </p>
      <a href="/saved">Gespeicherte Anzeigen öffnen</a>
    </div>
  </body>
</html>
